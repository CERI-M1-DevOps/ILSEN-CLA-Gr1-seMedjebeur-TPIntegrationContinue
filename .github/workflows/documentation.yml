name: Documentation

on:
  pull_request:
    types: [closed]
    branches: [ main ]
  workflow_dispatch:

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4
      - name: Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
      - name: Génération de la documentation Javadoc
        run: mvn -B javadoc:javadoc
      - name: Diagnostic - localiser les fichiers HTML générés
        run: find target -iname "*.html" -o -iname "*.css" | sort
      - name: Déploiement de la documentation sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site/apidocs
